[project]
name = "veripress"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noé Guenego", email = "noe.guenego@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "python-multipart>=0.0.34",
    "rawpy>=0.28.0",
    "trustmark>=0.9.2",
    "uvicorn[standard]>=0.54.0",
    "xrpl-py>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
