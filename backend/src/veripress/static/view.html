<!DOCTYPE html>
<!-- Public provenance record (/v/<id>): rendered by the server (social crawlers do not run
     JavaScript, so the Open Graph tags already hold the verdict), then drawn by site.js from the
     embedded report: same report, viewer and proof replay as the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · VeriPress</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:type" content="article">
<meta property="og:site_name" content="VeriPress">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:image" content="__IMAGE_URL__">
<meta property="og:url" content="__PAGE_URL__">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__TITLE__">
<meta name="twitter:description" content="__DESCRIPTION__">
<meta name="twitter:image" content="__IMAGE_URL__">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<div id="app" data-img="__IMAGE_PATH__"></div>
<input type="file" id="file" hidden>
<script id="report" type="application/json">__REPORT_JSON__</script>
<script src="/assets/site.js"></script>
</body>
</html>
