<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · VeriPress</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:type" content="article">
<meta property="og:site_name" content="VeriPress">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta property="og:image" content="__IMAGE_URL__">
<meta property="og:url" content="__PAGE_URL__">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="__TITLE__">
<meta name="twitter:description" content="__DESCRIPTION__">
<meta name="twitter:image" content="__IMAGE_URL__">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1b1d22; --muted: #6a6f7a; --line: #e2e0d8;
    --accent: #1f5eff; --accent-btn: #1f5eff; --real: #157347; --edited: #c2410c; --ai: #1864ab; --unknown: #5c636a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121318; --card: #1b1d24; --ink: #eceef2; --muted: #9aa0ab; --line: #2c2f38; --accent: #5b8cff; --accent-btn: #3563d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; } h1 a { color: inherit; text-decoration: none; } h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .badge { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; color: #fff; }
  .badge .dot { font-size: 40px; line-height: 1; } .badge strong { font-size: 24px; display: block; } .badge small { opacity: .92; }
  .v-real { background: var(--real); } .v-edited { background: var(--edited); } .v-ai { background: var(--ai); } .v-unknown { background: var(--unknown); }
  .stage { position: relative; margin-top: 12px; border-radius: 10px; overflow: hidden; background: #000; line-height: 0; }
  .stage img { width: 100%; height: auto; display: block; }
  .stage img.overlay { position: absolute; inset: 0; height: 100%; image-rendering: pixelated; }
  h2 { font-size: 15px; margin: 18px 0 8px; } h2 small { color: var(--muted); font-weight: 400; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  code { font: 13px ui-monospace, monospace; } a { color: var(--accent); }
  ul.claims, ol.history { list-style: none; padding: 0; margin: 8px 0 0; font-size: 15px; }
  ul.claims li { padding: 6px 0; border-bottom: 1px solid var(--line); } ul.claims li:last-child { border-bottom: 0; }
  ol.history { border-left: 2px solid var(--line); font-size: 14px; }
  ol.history li { position: relative; padding: 4px 0 8px 16px; }
  ol.history li::before { content: ""; position: absolute; left: -6px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  ol.history li.bad::before { background: #c92a2a; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .btn { border: 0; background: var(--accent-btn); color: #fff; font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="/">Veri<span>Press</span></a></h1>
    <span class="tag">Public provenance record · read-only</span>
  </header>
  <div class="card">
    <div class="badge" id="badge"><span class="dot" id="dot"></span><div><strong id="title"></strong><small id="reason"></small></div></div>
    <div class="stage">
      <img id="photo" src="__IMAGE_PATH__" alt="Published image">
      <img class="overlay" id="heatmap" alt="" hidden>
    </div>
    <div id="claimsBox" hidden>
      <h2>Proven claims <small>— zero-knowledge, exact time and place stay private</small></h2>
      <ul class="claims" id="claims"></ul>
    </div>
    <dl id="info"></dl>
    <div id="historyBox" hidden>
      <h2>Version history</h2>
      <ol class="history" id="history"></ol>
    </div>
    <div class="row">
      <button class="btn" id="copy" hidden>🔗 Copy link</button>
      <a class="btn ghost" href="__IMAGE_PATH__" download>⬇ Download image</a>
      <a class="btn ghost" href="/">Verify your own image</a>
    </div>
    <p class="note">This page re-verifies the stored image against its XRPL anchor each time it is opened.</p>
  </div>
</main>
<script id="report" type="application/json">__REPORT_JSON__</script>
<script>
const $ = (id) => document.getElementById(id);
const r = JSON.parse($("report").textContent);
const V = { real: ["🟢", "Real", "v-real"], edited: ["🟠", "Edited", "v-edited"], ai: ["🔵", "AI-generated", "v-ai"], unknown: ["⚪", "Unknown", "v-unknown"] };
const [dot, label, cls] = V[r.verdict] || V.unknown;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function short(h) { return h && h.length > 20 ? h.slice(0, 10) + "…" + h.slice(-6) : h; }
function fmtTime(ts) { return ts == null ? "—" : new Date(ts * 1000).toLocaleString(); }
const onChain = /^https:\/\/testnet\.xrpl\.org\//.test(r.anchor?.explorer_url || "");
function txLink(hash, url) {
  const code = `<code>${esc(short(hash))}</code>`;
  return onChain ? `<a href="${esc(url || "https://testnet.xrpl.org/transactions/" + hash)}" target="_blank" rel="noopener">${code} ↗</a>` : code;
}
// [T0, T1]: signed after ledger T0 closed (its hash is in the signed manifest), anchored at T1.
function timeWindow(tw) {
  if (!tw || tw.ledger_index == null) return null;
  const n = Number(tw.ledger_index);
  const led = onChain ? `<a href="https://testnet.xrpl.org/ledgers/${n}" target="_blank" rel="noopener">ledger #${n} ↗</a>` : `ledger #${n}`;
  if (!tw.t0_ok) return `⚠️ T0 ${led} not confirmed by the ledger`;
  return `🕐 ${esc(fmtTime(tw.not_before))} → ${esc(fmtTime(tw.not_after))} (${Math.max(0, tw.not_after - tw.not_before)} s) · after ${led}`;
}
$("badge").className = "badge " + cls; $("dot").textContent = dot;
$("title").textContent = r.verdict === "real" && r.anonymous ? "Real — accredited device (anonymous)" : r.verdict === "unknown" ? "Unknown — no provenance (≠ fake)" : label;
$("reason").textContent = r.pending ? "⏳ " + r.reason : r.reason;
// Fast anchoring: provisional verdict, reload until the anchor is validated on the ledger.
if (r.pending) setTimeout(() => location.reload(), 5000);
if (r.heatmap_png_b64) { $("heatmap").src = "data:image/png;base64," + r.heatmap_png_b64; $("heatmap").hidden = false; }
const claims = r.meta_claims || [];
$("claimsBox").hidden = !claims.length;
$("claims").innerHTML = claims.map((c) => `<li>${c.proof_ok ? "✅" : "❌"} ${esc({ day: "Taken on", area: "Taken within" }[c.kind] || c.kind)} <b>${esc(c.label)}</b></li>`).join("");
const a = r.anchor;
$("info").innerHTML = [
  ["Credential", r.credential && esc(r.credential)],
  ["Device status", r.credential_revoked_at && `⚠️ revoked since ${esc(fmtTime(r.credential_revoked_at))} (after this image was anchored)`],
  ["Signature", r.zk ? (r.zk.proof_ok ? "✅ zero-knowledge proof valid" : "❌ zero-knowledge proof invalid") : r.entry_id ? (r.signature_ok ? "✅ valid" : "❌ invalid") : null],
  ["Signer", a && (a.signer ? `<code>${esc(short(a.signer))}</code>` : r.anonymous ? "🕶️ anonymous accredited device" : null)],
  ["Signed between", timeWindow(r.time_window)],
  ["Anchored", a && esc(fmtTime(a.timestamp))],
  ["Transaction", a && txLink(a.tx_hash, a.explorer_url)],
  ["Batch", r.batch && `photo ${Number(r.batch.index) + 1} of ${Number(r.batch.size)} in one transaction · Merkle receipt ✅`],
  ["Disclosure CID", r.disclosure_cid && `<code title="${esc(r.disclosure_cid)}">${esc(short(r.disclosure_cid))}</code>`],
  ["Tiles", r.tiles && esc(`${r.tiles.verdict} · ${r.tiles.counts.exact + r.tiles.counts.robust}/${r.tiles.statuses.length} match`)],
].filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
const OPS = { capture: "📷 Captured", edit: "✏️ Signed edit", develop: "🎞️ Developed from the signed RAW", ai_generate: "🤖 AI-generated" };
const hist = r.history || [];
$("historyBox").hidden = hist.length < 2;
$("history").innerHTML = hist.map((h) => `<li class="${h.verified ? "" : "bad"}">${esc(OPS[h.op] || h.op || "unknown version")} · ${esc(fmtTime(h.timestamp))} · ${txLink(h.tx_hash)}${h.verified ? "" : " · ❌ not verified"}</li>`).join("");
if (navigator.clipboard) {
  $("copy").hidden = false;
  $("copy").addEventListener("click", async () => { await navigator.clipboard.writeText(location.href); $("copy").textContent = "✅ Link copied"; });
}
</script>
</body>
</html>
