<!DOCTYPE html>
<!--
  VeriPress: examine and certify photos. Art direction "expert report" (light + dark).
  Examine calls /api/verify; the viewer shows the tiles, their drift and the Merkle tree on the
  photo; the proof replay recomputes the Merkle path, the manifest digest and the Ed25519
  signature in the browser and reads the anchor from a public XRPL node. Certify signs with the
  device key, the Touch ID passkey, anonymously (ZK) or as an AI generator, single or batch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriPress</title>
<style>
*{box-sizing:border-box}
body{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
.ovl{position:relative;line-height:0}
.ovl img{width:100%;height:auto}
.ovl canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;transition:opacity .2s}
.hidden{display:none!important}

/* =====================================================================
   VARIANT A — Expert report: paper, ink, serif, numbered findings. Light + dark ("darkroom").
   ===================================================================== */
.vA{--bg:#efebe2;--paper:#fbf9f4;--ink:#1c1b19;--muted:#6b665c;--soft:#4a463e;--line:#d6cfbf;--line2:#c9c2b3;--drop:#f7f4ee;
  --ok:#1f6b45;--bad:#a3341f;--ai:#2a4f8f;--warn:#9a6a00;--link:#2a4f8f;--shadow:rgba(0,0,0,.25);--stage:#e4dfd3}
.vA.dark{--bg:#12110e;--paper:#1b1915;--ink:#ece5d6;--muted:#948c7c;--soft:#bdb4a2;--line:#34302a;--line2:#2a2722;--drop:#1f1d18;
  --ok:#5cc48d;--bad:#ef6b4f;--ai:#7ea6ef;--warn:#e0b04a;--link:#9cb8ef;--shadow:rgba(0,0,0,.7);--stage:#0d0c0a}
.vA{background:var(--bg);color:var(--ink);font:16px/1.55 "Iowan Old Style","Charter","Georgia",serif;min-height:100vh;transition:background .3s,color .3s}
.vA .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.82em;letter-spacing:.01em}
.vA .sans{font-family:system-ui,-apple-system,sans-serif}
.vA .wrap{max-width:1180px;margin:0 auto;padding:28px 32px 120px}
.vA header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;gap:20px}
.vA .brand{font-size:26px;letter-spacing:.02em;font-weight:700}
.vA .brand{white-space:nowrap}
.vA .brand small{font-weight:400;font-style:italic;font-size:15px;color:var(--muted);margin-left:10px}
.vA nav{display:flex;align-items:baseline}
.vA nav button{white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;font:600 15px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0;margin-left:26px}
.vA nav button[aria-current=true]{color:var(--ink);border-color:var(--bad)}
.vA nav .theme{border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.vA .lede{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:34px 0 26px;border-bottom:1px solid var(--line2)}
.vA .lede h1{font-size:40px;line-height:1.1;margin:0;font-weight:600}
.vA .lede p{margin:0;color:var(--soft)}
.vA .drop{border:1.5px dashed var(--muted);padding:26px;text-align:center;background:var(--drop);cursor:pointer}
.vA .drop b{display:block;font-size:19px}
.vA .drop.picked{display:flex;align-items:center;gap:22px;text-align:left;border-style:solid;padding:14px}
.vA .drop.picked img{width:180px;height:180px;object-fit:cover;background:var(--stage)}
.vA .drop.picked span{display:block;color:var(--soft);font-size:14px}
.vA .drop .change{margin-top:10px;font:600 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)!important}
.vA .primary[disabled]{opacity:.35;cursor:not-allowed}
.vA .samples{margin-top:10px;font:13px system-ui,sans-serif;color:var(--muted)}
.vA .samples button{background:none;border:0;border-bottom:1px dotted var(--muted);color:var(--ink);margin:0 6px;padding:0}
.vA .doc{background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 18px 40px -24px var(--shadow);margin-top:30px;padding:36px 44px}
.vA .dochead{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;border-bottom:1px solid var(--ink);padding-bottom:18px}
.vA .kicker{font:600 12px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vA .dochead h2{font-size:30px;margin:6px 0 4px;font-weight:600}
.vA .stamp{width:150px;height:150px;border-radius:50%;border:4px double currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);font:700 19px/1.1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.vA .stamp small{font-size:10px;letter-spacing:.16em;margin-top:6px;font-weight:600}
.vA .s-real{color:var(--ok)}.vA .s-edited{color:var(--bad)}.vA .s-ai{color:var(--ai)}.vA .s-unknown{color:var(--muted)}
.vA .docbody{margin-top:26px}
.vA .docbody table{margin-top:28px}
.vA .vfig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:stretch}
.vA .vright{display:flex;flex-direction:column;padding-top:44px}
.vA .tk{display:flex;justify-content:space-between;font-size:10.5px}
.vA figure{margin:0}
.vA figcaption{font-size:14px;color:var(--soft);margin-top:8px;font-style:italic}
.vA table{width:100%;border-collapse:collapse}
.vA td{border-top:1px solid var(--line);padding:11px 8px 11px 0;vertical-align:top}
.vA td.n{width:34px;color:var(--muted);font-style:italic}
.vA td.r{width:92px;text-align:right;font:700 11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding-top:14px}
.vA td.r.ok{color:var(--ok)}.vA td.r.fail{color:var(--bad)}.vA td.r.warn{color:var(--warn)}.vA td.r.info{color:var(--muted)}
.vA td b{display:block}
.vA td small{color:var(--soft);font-size:14px}
.vA .annex{margin-top:30px;border-top:1px solid var(--ink);padding-top:14px}
.vA .annex summary{cursor:pointer;font:600 12px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.vA dl{display:grid;grid-template-columns:190px 1fr;gap:6px 18px;margin:14px 0 0}
.vA dt{color:var(--muted);font-size:14px}
.vA dd{margin:0;word-break:break-all}
.vA a{color:var(--link)}
.vA .form{display:grid;grid-template-columns:220px 1fr;margin-top:10px}
.vA .form>div{padding:22px 0;border-bottom:1px solid var(--line2)}
.vA .form .lab{font:600 12px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:26px}
.vA .opt{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;cursor:pointer}
.vA .opt input{margin-top:6px;accent-color:var(--bad)}
.vA .opt b{font-size:17px}
.vA .opt small{display:block;color:var(--soft);font-size:14px}
.vA .primary{background:var(--ink);color:var(--paper);border:0;padding:14px 28px;font:600 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.vA .note{font-size:14px;color:var(--muted);font-style:italic;margin-left:14px}
.vA .busy{padding:40px 0;font-style:italic;color:var(--muted)}
/* viewer: photo / tiles / drift / merkle */
.vA .vtools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font:13px system-ui,sans-serif}
.vA .seg{display:inline-flex;border:1px solid var(--ink)}
.vA .seg button{background:none;border:0;color:var(--ink);padding:7px 13px;font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.vA .seg button+button{border-left:1px solid var(--ink)}
.vA .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.vA .stagebox{background:var(--stage);padding:10px}
.vA .ovl{cursor:crosshair}
.vA .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;font:13px system-ui,sans-serif;color:var(--soft);min-height:30px}
.vA .chipk{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--ink);padding:4px 9px;font:12px system-ui,sans-serif}
.vA .chipk i{width:10px;height:10px;display:inline-block}
.vA .chipk[aria-pressed=false]{opacity:.38;text-decoration:line-through}
.vA .ramp{width:180px;height:10px;background:linear-gradient(90deg,rgba(217,162,27,.05),rgba(217,162,27,.6) 70%,#e2452b 72%,#e2452b)}
.vA input[type=range]{accent-color:var(--bad);width:200px}
.vA .ghost{background:none;border:1px solid var(--ink);color:var(--ink);padding:5px 12px;font:600 12px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.vA .vinfo{white-space:pre-line;margin-top:8px;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--soft);min-height:38px;border-left:2px solid var(--bad);padding-left:10px}
.vA .treebox{margin-top:16px}
.vA .treebox .kicker{display:flex;justify-content:space-between}
.vA svg.mtree{width:100%;flex:1;min-height:240px;max-height:520px;display:block;margin:6px 0;cursor:pointer;background:var(--stage)}
.vA svg.mtree rect.path{stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.vA svg.mtree rect.sib{stroke:var(--link);stroke-width:2px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
/* proof replay (idea 1): always dark, large type, made for a projector */
.rp{position:fixed;inset:0;z-index:900;background:#0a0907;color:#ece5d6;font:16px/1.5 "Iowan Old Style","Charter",Georgia,serif;overflow:auto;animation:rpin .3s ease both}
@keyframes rpin{from{opacity:0}}
.rpin{max-width:1400px;margin:0 auto;padding:22px 36px 20px;height:100vh;display:flex;flex-direction:column}
.rphead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #ece5d6;padding-bottom:12px}
.rphead h2{font-size:34px;margin:4px 0 0;font-weight:600}
.rpk{font:600 12px system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#948c7c}
.rpb{background:none;border:1px solid #ece5d6;color:#ece5d6;padding:7px 14px;margin-left:8px;font:600 13px system-ui,sans-serif}
.rpgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;margin-top:18px;flex:1;min-height:0}
.rpgrid .ovl img{max-height:calc(100vh - 170px);width:auto;max-width:44vw}
.rpgrid .ovl{background:#000}
.rpcap{font:13px ui-monospace,Menlo,monospace;color:#bdb4a2;margin-top:10px;min-height:20px}
.rpsteps{list-style:none;margin:0;padding:0 6px 0 0;overflow:auto;min-height:0}
.rpsteps li{display:grid;grid-template-columns:38px 1fr auto;gap:14px;padding:9px 0;border-bottom:1px solid #2a2722;animation:rpin .35s ease both}
.rpn{width:28px;height:28px;border:1px solid #948c7c;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 13px system-ui,sans-serif;color:#948c7c}
.rpsteps li.ok .rpn{border-color:#5cc48d;color:#5cc48d}.rpsteps li.ko .rpn{border-color:#ef6b4f;color:#ef6b4f}
.rpsteps b{font-size:19px;font-weight:600}
.rpl{font:13px/1.6 ui-monospace,Menlo,monospace;color:#d8d0c0;margin-top:4px}
.rpl div{animation:rpin .3s ease both}
.rpl code{color:#f0c674;background:none}
.rpdim{color:#7d7667}
.rps{font:700 15px system-ui,sans-serif;color:#948c7c;padding-top:4px}
.rpsteps li.ok .rps{color:#5cc48d}.rpsteps li.ko .rps{color:#ef6b4f}
.rpfin{margin-top:18px;padding:16px 18px;border:1px solid #5cc48d;font-size:18px;line-height:1.45;animation:rpin .5s ease both}
.rpfin.bad{border-color:#ef6b4f}
.rped{color:#ef6b4f}

/* page furniture (wired version) */
.vA .pill{margin-left:22px;font:500 12px system-ui,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.vA .pill.warn{color:var(--warn);border-color:var(--warn)}
.vA .pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.vA .pill.warn::before{background:var(--warn)}
.vA .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--bad);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-left:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.vA .err{color:var(--bad);font:14px system-ui,sans-serif;margin:10px 0 0}
.vA .hint{color:var(--soft);font-size:14px;margin:0 0 10px}
.vA .optional{display:block;font-weight:400;letter-spacing:.06em;text-transform:none;margin-top:4px}
.vA .field{width:100%;max-width:560px;background:var(--drop);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font-size:13px}
.vA .check{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:10px;color:var(--soft)}
.vA .check input{accent-color:var(--bad)}
.vA .opt.off{opacity:.55;cursor:default}
.vA .warnline{color:var(--warn)!important}
.vA .linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;font:inherit;font-size:14px}
.vA a.primary,.vA a.ghost{display:inline-block;text-decoration:none}
.vA .ghost{margin-left:6px}
.vA .ghost[disabled],.vA .seg button[disabled]{opacity:.4;cursor:not-allowed}
.vA .drop.over{border-color:var(--bad);background:var(--paper)}
.vA .doc.cert{margin-top:34px}
.vA .certbody{display:grid;grid-template-columns:260px 1fr;gap:32px;margin-top:22px;align-items:start}
.vA .certbody img{width:100%;background:var(--stage)}
.vA .certbody dl{margin:0}
.vA .actions{margin:18px 0 8px}
.vA .pend{color:var(--warn)}
.vA .blist{font-size:14px;padding-left:18px;margin:12px 0 0}
.vA .txbox{margin-top:12px;font:13px system-ui,sans-serif;color:var(--muted)}
.vA .txbox summary{cursor:pointer}
.vA .txbox .field{margin:8px 0}
.vA .hist{margin:10px 0 0;padding-left:20px;font-size:15px}
.vA .hist li.bad{color:var(--bad)}
.vA .redbox{border:1px solid var(--line);padding:12px 14px;margin-top:12px;font-size:14px}
.vA .redbox p{margin:6px 0}
.vA .ovl canvas.rcv{pointer-events:auto;cursor:crosshair;z-index:2}
.present .vA{font-size:18px}
.present .vA .wrap{max-width:1560px}


</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file" accept="image/*,.heic,.heif,.dng,.cr2,.cr3,.nef,.arw,.raf,.rw2,.orf" hidden>
<script>
// ---------------------------------------------------------------- state, helpers, API
const $ = (s, r = document) => r.querySelector(s);
const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (h, n = 6) => (h ? (h.length > 2 * n + 2 ? `${h.slice(0, n)}…${h.slice(-n)}` : h) : "—");
const when = (t) => (t ? new Date(t * 1000).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—");
const hms = (t) => new Date(t * 1000).toLocaleTimeString("en-GB");
const safeUrl = (u) => { try { const x = new URL(u, location.href); return ["https:", "http:"].includes(x.protocol) ? x.href : "#"; } catch { return "#"; } };
const S = {
  tab: "verify", theme: localStorage.vpTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  health: null, pk: null, local: ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname), specimens: [],
  // examine
  vfile: null, img: null, tx: "", busy: false, err: "", report: null, retries: 0,
  // certify
  sfile: null, simg: null, mode: "device", parent: "", develop: false, sbusy: "", serr: "", sres: null, svalid: null,
  bfiles: [], bbusy: false, bres: null, berr: "",
  // viewer (tiles, drift, Merkle tree) and redaction
  view: null, off: {}, level: 0, hover: null, hnode: null, pin: null, M: null,
  red: false, boxes: [], drag: null, rbusy: false, rerr: "", rdl: null,
};
async function api(url, opts) {
  const r = await fetch(url, opts), b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof b.detail === "string" ? b.detail : `HTTP ${r.status}`);
  return b;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Examine: the watermark (or perceptual hash, or a given record id) finds the record, the server
// checks signature, ledger and tiles. A provisional verdict (anchor not validated yet) is re-run.
async function runVerify(file, { tx = S.tx, again = false } = {}) {
  if (!again) { S.vfile = file; S.img = URL.createObjectURL(file); S.retries = 0; S.report = null; S.rdl = null; }
  S.tab = "verify"; S.busy = true; S.err = ""; S.red = false; render();
  const fd = new FormData(); fd.append("image", S.vfile); if (tx) fd.append("entry_id", tx.trim());
  try { S.report = await api("/api/verify", { method: "POST", body: fd }); } catch (e) { S.err = e.message; }
  S.busy = false; render();
  if (S.report?.pending && S.retries < 8) { S.retries++; const f = S.vfile; setTimeout(() => S.vfile === f && runVerify(f, { tx, again: true }), 4000); }
}
async function loadSpecimen(name) {
  const b = await fetch(`/api/demo/${encodeURIComponent(name)}`).then((r) => (r.ok ? r.blob() : null));
  if (b) { S.tx = ""; runVerify(new File([b], name, { type: b.type })); }
}
// Picking a file: in Certify it is only selected (shown in the drop zone); in Examine it is checked.
function takeFile(f) {
  if (!f) return;
  if (S.tab === "sign") { S.sfile = f; S.simg = URL.createObjectURL(f); S.sres = null; S.serr = ""; render(); }
  else { S.tx = ""; runVerify(f); }
}
$("#file").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; takeFile(f); });
const pick = () => $("#file").click();
document.addEventListener("dragover", (e) => { const d = e.target.closest?.("[data-pick]"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => e.target.closest?.("[data-pick]")?.classList.remove("over"));
document.addEventListener("drop", (e) => { const d = e.target.closest?.("[data-pick]"); if (!d) return; e.preventDefault(); d.classList.remove("over"); takeFile(e.dataTransfer.files[0]); });
// HEIC on Chrome, camera RAW: the browser cannot draw it; the server develops a JPEG preview.
async function previewFallback(img, which) {
  if (img.dataset.fb) return; img.dataset.fb = 1;
  const fd = new FormData(); fd.append("image", which === "sign" ? S.sfile : S.vfile);
  const r = await fetch("/api/preview", { method: "POST", body: fd }).catch(() => null);
  if (!r?.ok) return;
  const u = URL.createObjectURL(await r.blob());
  if (which === "sign") S.simg = u; else S.img = u;
  img.src = u; img.addEventListener("load", () => drawViewer(), { once: true });
}

// Certify. Fast anchoring: the server answers at submission, the page polls until validated.
async function runSign() {
  if (!S.sfile) return;
  if (S.develop && !S.parent.trim()) { S.serr = "A RAW development needs the record id of the signed RAW."; return render(); }
  S.serr = ""; S.sres = null; S.svalid = null;
  try {
    if (S.mode === "passkey") {
      S.sbusy = "Preparing the manifest…"; render();
      const fd = new FormData(); fd.append("image", S.sfile); if (S.parent.trim()) fd.append("parent", S.parent.trim());
      const prep = await api("/api/sign/passkey/prepare", { method: "POST", body: fd });
      S.sbusy = "Touch ID…"; render();
      const cred = await navigator.credentials.get({ publicKey: {
        challenge: hexBytes(prep.challenge), // = the manifest digest
        allowCredentials: [{ type: "public-key", id: b64u.dec(S.pk.credential_id) }], userVerification: "required", timeout: 60000 } });
      const assertion = { credential_id: b64u.enc(cred.rawId), authenticator_data: b64u.enc(cred.response.authenticatorData),
        client_data_json: b64u.enc(cred.response.clientDataJSON), signature: b64u.enc(cred.response.signature), public_key: S.pk.public_key };
      S.sbusy = "Recording on the XRP Ledger…"; render();
      S.sres = await api("/api/sign/passkey/complete", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prep_id: prep.prep_id, assertion, wait: 0 }) });
    } else {
      const fd = new FormData();
      fd.append("image", S.sfile); fd.append("signer", S.mode === "ai" ? "ai" : "device"); fd.append("wait", "0");
      if (S.mode === "anonymous") fd.append("anonymous", "1");
      if (S.parent.trim()) fd.append("parent", S.parent.trim());
      if (S.develop) fd.append("op", "develop");
      S.sbusy = S.mode === "anonymous" ? "Proving in zero knowledge, then recording on XRPL…" : "Signing every tile, then recording on XRPL…"; render();

// ---------------------------------------------------------------- proof replay, in the browser
// Everything below is recomputed here with WebCrypto: robust leaves from the public disclosure,
// the Merkle path of one tile, the root, the manifest digest; the anchor is read straight from a
// public XRPL node (WebSocket, no VeriPress server in between) and the Ed25519 signature checked.
const hx = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
const unhx = (h) => Uint8Array.from(h.match(/../g) || [], (x) => parseInt(x, 16));
const cat = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
const sha = async (b) => new Uint8Array(await crypto.subtle.digest("SHA-256", b));
const u32 = (i) => Uint8Array.of(i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255);
const i16 = (v) => { const o = new Uint8Array(v.length * 2), d = new DataView(o.buffer); v.forEach((x, k) => d.setInt16(2 * k, x)); return o; };
const enc = new TextEncoder();
const h8 = (h) => `${h.slice(0, 8)}…${h.slice(-6)}`;

async function robustLeaf(t) {
  if (t.r) return unhx(t.r); // redacted tile: only its leaf hash is disclosed
  return sha(cat(Uint8Array.of(0), enc.encode("VPR1"), u32(t.i), unhx(t.salt), i16(t.f), t.g ? i16(t.g) : new Uint8Array()));
}
function xrplTx(hash) {
  return new Promise((ok, ko) => {
    const ws = new WebSocket("wss://s.altnet.rippletest.net:51233"), to = setTimeout(() => { ws.close(); ko(new Error("XRPL node timeout")); }, 9000);
    ws.onopen = () => ws.send(JSON.stringify({ id: 1, command: "tx", transaction: hash }));
    ws.onmessage = (e) => { clearTimeout(to); ws.close(); const m = JSON.parse(e.data); m.result ? ok(m.result) : ko(new Error(m.error || "tx not found")); };
    ws.onerror = () => { clearTimeout(to); ko(new Error("cannot reach the XRPL node")); };
  });
}

function replayTile(r) {
  if (S.pin != null) return S.pin;
  const st = r.tiles.statuses, ch = st.indexOf("changed");
  return ch >= 0 ? ch + r.tiles.grid.cols * 2 < st.length && st[ch + r.tiles.grid.cols * 2] === "changed" ? ch + r.tiles.grid.cols * 2 : ch : Math.floor(st.length / 2);
}
function rpDraw(k, j, i) {
  const cv = $("#rpcv"), img = $("#rpimg"), M = S.M; if (!cv || !img.clientWidth) return;
  const dpr = devicePixelRatio || 1, W = img.clientWidth * dpr, H = img.clientHeight * dpr;
  cv.width = W; cv.height = H; const x = cv.getContext("2d"), tw = W / M.cols, th = H / M.rows;
  x.fillStyle = "rgba(10,9,7,.62)"; x.fillRect(0, 0, W, H);
  if (k != null) {
    const lo = j << k, hi = Math.min((j + 1) << k, M.n);
    for (let t = lo; t < hi; t++) x.clearRect((t % M.cols) * tw, Math.floor(t / M.cols) * th, tw + .5, th + .5);
    x.strokeStyle = "rgba(255,255,255,.9)"; x.lineWidth = 1.5 * dpr; x.beginPath();
    for (let t = lo; t < hi; t++) {
      const bx = (t % M.cols) * tw, by = Math.floor(t / M.cols) * th, c = t % M.cols, inN = (u) => u >= lo && u < hi;
      if (c === M.cols - 1 || !inN(t + 1)) { x.moveTo(bx + tw, by); x.lineTo(bx + tw, by + th); }
      if (c === 0 || !inN(t - 1)) { x.moveTo(bx, by); x.lineTo(bx, by + th); }
      if (!inN(t + M.cols)) { x.moveTo(bx, by + th); x.lineTo(bx + tw, by + th); }
      if (!inN(t - M.cols)) { x.moveTo(bx, by); x.lineTo(bx + tw, by); }
    }
    x.stroke();
  }
  if (i != null) { x.strokeStyle = M.st[i] === "changed" ? "#ef6b4f" : "#5cc48d"; x.lineWidth = 3 * dpr; x.strokeRect((i % M.cols) * tw + 1, Math.floor(i / M.cols) * th + 1, tw - 2, th - 2); }
}

async function replay() {

  box.innerHTML = `<div class="rpin"><div class="rphead"><div><div class="rpk">Proof replay · computed in this browser</div><h2>Don't trust us. Your browser checks it.</h2></div>
      <div><button class="rpb" data-rp="again">↻ Replay</button><button class="rpb" data-rp="close">✕</button></div></div>
    <div class="rpgrid"><div><div class="ovl"><img id="rpimg" src="${S.img}" alt=""><canvas id="rpcv"></canvas></div><div class="rpcap" id="rpcap">Tile #${i}</div></div>

  $("#rp")?.remove(); document.body.appendChild(box);

  const step = (n, title, html = "") => { const li = document.createElement("li"); li.innerHTML = `<span class="rpn">${n}</span><div><b>${title}</b><div class="rpl">${html}</div></div><span class="rps">…</span>`; steps.appendChild(li); li.scrollIntoView({ block: "nearest", behavior: "smooth" }); return li; };
  const done = (li, ok, txt) => { li.classList.add(ok ? "ok" : "ko"); li.querySelector(".rps").textContent = txt || (ok ? "✓" : "✗"); };
  const line = (li, h) => { const d = document.createElement("div"); d.innerHTML = h; li.querySelector(".rpl").appendChild(d); return d; };
  try {

    let li = step(1, "Fetch the public record");
    const P = await fetch(`/api/proof/${r.entry_id}`).then((x) => x.json()), man = JSON.parse(P.manifest), tiles = P.disclosure.tiles;
    line(li, `manifest <code>${P.manifest.length} bytes</code> · disclosure <code>${tiles.length} tiles</code>`);
    line(li, `<span class="rpdim">served by anyone (here our server): nothing below takes it on trust</span>`);

    }

    done(li, true); await sleep(900); if (!alive()) return;
    // 6. XRPL
    li = step(6, "Ask the XRP Ledger directly");
    line(li, `<span class="rpdim">wss://s.altnet.rippletest.net · tx ${h8(P.tx_hash)}</span>`);
    const tx = await xrplTx(P.tx_hash), memo = JSON.parse(new TextDecoder().decode(unhx(tx.Memos[0].Memo.MemoData)));
    const batch = !memo.d && memo.b; // aggregated anchoring: the memo holds the root of N records
    line(li, batch ? `${tx.validated ? "validated" : "pending"} in ledger <code>#${tx.ledger_index}</code> · batch of <code>${memo.n}</code> records, root <code>${h8(memo.b)}</code>`
      : `${tx.validated ? "validated" : "pending"} in ledger <code>#${tx.ledger_index}</code> · memo d = <code>${h8(memo.d)}</code>`);
    if (batch) line(li, `<span class="rpdim">this record's receipt (its leaf under that root) is checked by the server, not replayed here</span>`);
    const memoOk = batch ? null : memo.d === dig;
    done(li, memoOk !== false, batch ? "batch" : memoOk ? "= ✓" : "≠"); await sleep(900); if (!alive()) return;
    // 7. signature
    li = step(7, "Check the device's signature");
    let sigOk = null;
    if (memo.s && memo.k?.startsWith("ED")) {
      try {
        const key = await crypto.subtle.importKey("raw", unhx(memo.k.slice(2)), { name: "Ed25519" }, false, ["verify"]);
        sigOk = await crypto.subtle.verify({ name: "Ed25519" }, key, unhx(memo.s), unhx(dig));
      } catch { sigOk = undefined; }
      line(li, `Ed25519 · key <code>${h8(memo.k)}</code> = manifest.signer ${memo.k === man.signer ? "✓" : "✗"}`);
      line(li, sigOk === undefined ? `<span class="rpdim">this browser has no Ed25519 in WebCrypto</span>` : `signature over the digest: <b>${sigOk ? "valid" : "INVALID"}</b>`);
      done(li, sigOk !== false && memo.k === man.signer);
    } else {
      const how = r.anonymous ? "a Groth16 zero-knowledge proof (anonymous device)" : r.passkey ? "a Touch ID passkey (P-256 WebAuthn assertion)" : batch ? "a signature inside the batch receipt" : "a signature stored with the record";
      line(li, `signed with ${how}: checked by the server, not replayed here`);
      done(li, true, "—");
    }
    await sleep(700); if (!alive()) return;
    // verdict for this tile
    const d = M.d[i], changed = M.st[i] === "changed", full = rootOk && memoOk === true && sigOk === true, fin = document.createElement("div");
    fin.className = "rpfin " + (rootOk && memoOk !== false && sigOk !== false ? "good" : "bad");
    fin.innerHTML = full
      ? `<b>Proven in this browser:</b> tile #${i} belongs to what an accredited device signed on ${when(tx.date + 946684800)}, recorded on the XRP Ledger. VeriPress' server was trusted for nothing.`
      : rootOk && memoOk !== false && sigOk !== false
        ? `<b>Proven in this browser up to the ledger:</b> tile #${i} is part of the record anchored on ${when(tx.date + 946684800)}; ${batch ? "the batch receipt and " : ""}the signature were checked by the server.`
        : `<b>The proof does not hold:</b> what was recomputed here does not match the ledger.`;
    if (changed) fin.innerHTML += `<br><span class="rped">But the photo you submitted no longer matches it here: drift ${d?.toFixed(1)} for a tolerance of ${TOL}. This tile was edited.</span>`;
    steps.appendChild(fin); fin.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } catch (e) { step("!", "Stopped", esc(e.message)); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-rp]"); if (!b) return;
  if (b.dataset.rp === "close") { S.run++; $("#rp")?.remove(); }
  else if (b.dataset.rp === "again") replay();
  else if (b.dataset.rp === "open") replay();
});

// ---------------------------------------------------------------- render + events
function render() {
  const y = scrollY;
  $("#app").innerHTML = page();
  scrollTo(0, y);
  bindViewer();
}
$("#app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-pick],[data-sample],[data-view],[data-off],[data-fold],[data-theme],[data-sign],[data-batch],[data-examine],[data-pksetup],[data-redstart],[data-redclear],[data-redcancel],[data-redapply],[data-reverify]");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; if (d.tab === "sign") refreshPasskey(); render(); }
  else if (d.view) { S.view = d.view; render(); }
  else if (d.off) { S.off[d.off] = !S.off[d.off]; render(); }
  else if ("fold" in d) foldToRoot();
  else if ("theme" in d) { S.theme = S.theme === "dark" ? "light" : "dark"; localStorage.vpTheme = S.theme; render(); }
  else if ("pick" in d) pick();
  else if (d.sample) loadSpecimen(d.sample);
  else if ("sign" in d) runSign();
  else if ("batch" in d) runBatch();
  else if (d.examine) examineUrl(d.examine, "certified.png");
  else if ("pksetup" in d) { e.preventDefault(); setupPasskey(); }
  else if ("redstart" in d) { S.red = true; S.boxes = []; S.rerr = ""; render(); }
  else if ("redclear" in d) { S.boxes = []; render(); }
  else if ("redcancel" in d) { S.red = false; S.boxes = []; render(); }
  else if ("redapply" in d) applyRedaction();
  else if ("reverify" in d) runVerify(S.vfile, { tx: S.tx, again: true });
});
// Typing never re-renders (focus stays); choices that change what is enabled do.
$("#app").addEventListener("input", (e) => {
  const t = e.target;
  if ("level" in t.dataset) { S.level = +t.value; drawViewer(); }
  else if (t.dataset.input === "parent") S.parent = t.value;
  else if (t.dataset.input === "tx") S.tx = t.value;
});
$("#app").addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "m") { S.mode = t.value; render(); }
  else if (t.dataset.input === "develop") S.develop = t.checked;
  else if ("batchfiles" in t.dataset) { S.bfiles = [...t.files]; S.bres = null; render(); }
});
// Presentation mode (projector): larger type, full screen. Key P.
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#rp")) { S.run++; $("#rp").remove(); return; }
  if (e.key.toLowerCase() !== "p" || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const on = document.documentElement.classList.toggle("present");
  if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  drawViewer();
});
pollHealth(); refreshPasskey(); render();

</script>
